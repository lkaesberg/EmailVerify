name: ci

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lkaesberg/emailverify

jobs:
  docker-nightly:
    name: Docker (nightly)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (nightly)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly

      - name: Build & push (nightly)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release:
    name: Docker (release)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (release)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build & push (release)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (trigger Coolify)
    needs: docker-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # The bot runs as a Coolify application that builds this repo from source,
      # so a deploy is just a webhook call -- no SSH key and no compose stack on
      # the server any more. Coolify builds the configured branch (main), so tag
      # a commit that is on main's HEAD.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: https://coolify.wksolutions.de
          COOLIFY_APP_UUID: fsyzdu0vfspz8py52fgkucib
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Coolify's deploy endpoint is POST with a JSON body; the older
          # GET ?uuid=... form now returns 405.
          curl --fail-with-body -sS -X POST \
            "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"$COOLIFY_APP_UUID\"}"

  pages-build:
    name: Build Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      urls: ${{ steps.changed.outputs.urls }}
      url_count: ${{ steps.changed.outputs.count }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the push's previous head is there to diff against.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      # MkDocs 2.0 drops the plugin and theme-override systems this site depends on
      # (overrides/, hooks/), so stay on 1.x. Material >= 9.7.5 caps it too; the
      # explicit pin keeps that true even if the cap is ever relaxed.
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7.5,<10"
      - run: mkdocs build
        env:
          # Silences Material's MkDocs 2.0 announcement banner in the build log.
          NO_MKDOCS_2_WARNING: "1"

      # Pages this push changed, for the IndexNow job. A template or nav change
      # (mkdocs.yml, overrides/) can alter every page, and so can a push whose
      # previous head is unknown (first push, force-push): submit the whole sitemap.
      - name: List changed pages
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- mkdocs.yml overrides/; then
            urls=$(git diff --no-renames --name-only "$BEFORE" HEAD -- 'docs/*.md' \
              | sed -E 's#^docs/##; s#(^|/)index\.md$#\1#; s#\.md$#/#; s#^#https://getemailverified.com/#')
          else
            urls=$(grep -o '<loc>[^<]*' site/sitemap.xml | sed 's/<loc>//')
          fi
          count=$(printf '%s' "$urls" | grep -c . || true)
          echo "$count changed page(s)"; printf '%s\n' "$urls"
          { echo "count=$count"; echo 'urls<<EOF'; printf '%s\n' "$urls"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages-deploy:
    name: Deploy Pages
    needs: pages-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify search engines (IndexNow)
    needs: [pages-build, pages-deploy]
    if: github.ref == 'refs/heads/main' && needs.pages-build.outputs.url_count != '0'
    runs-on: ubuntu-latest

    steps:
      # IndexNow tells Bing (and through it DuckDuckGo and Yahoo), Yandex, Seznam
      # and Naver which pages changed; Google ignores it and reads the sitemap.
      # The key is public by design: docs/<key>.txt proves the site sent it.
      - name: Submit changed pages
        env:
          KEY: 763fa7f44503dec39d6f905814942259
          URLS: ${{ needs.pages-build.outputs.urls }}
        run: |
          jq -n --arg key "$KEY" --arg urls "$URLS" '{
              host: "getemailverified.com",
              key: $key,
              keyLocation: "https://getemailverified.com/\($key).txt",
              urlList: ($urls | split("\n") | map(select(length > 0)))
            }' \
          | curl --fail-with-body -sS -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" -d @- \
              -w 'HTTP %{http_code}\n'
