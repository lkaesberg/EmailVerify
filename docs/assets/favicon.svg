<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Rounded tab icon for browsers. Google Search ignores SVG favicons and uses the opaque square PNGs instead. -->
  <clipPath id="r"><rect width="256" height="256" rx="56" ry="56"/></clipPath>
  <image width="256" height="256" clip-path="url(#r)" xlink:href="data:image/png;base64,"/>
</svg>
