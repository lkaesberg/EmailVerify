site_name: EmailVerify for Discord
site_description: A Discord bot that verifies users own a specific email address — domain-based access control with privacy-first storage.
site_url: https://getemailverified.com/
site_author: Lars Kaesberg
repo_url: https://github.com/lkaesberg/EmailVerify
copyright: >
  © WKSolutions GbR — EmailVerify is free software under
  <a href="https://github.com/lkaesberg/EmailVerify/blob/main/LICENSE">AGPL-3.0-or-later</a>.
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  logo: https://raw.githubusercontent.com/lkaesberg/EmailBot/main/images/emailbot.png
  favicon: https://raw.githubusercontent.com/lkaesberg/EmailBot/main/images/emailbot.png
  palette:
    # Follows the visitor's OS preference by default; the header toggle overrides it.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - toc:
      permalink: true
plugins:
  - search
extra:
  # Short brand Google should show as the "site name" in search results (the
  # line above the page title). Google reads it from the WebSite JSON-LD and
  # og:site_name in overrides/main.html; site_name above stays the longer
  # header/title form.
  brand: EmailVerify
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/fEBSHUQXu2
      name: Support Discord
    - icon: fontawesome/brands/github
      link: https://github.com/lkaesberg/EmailVerify
      name: GitHub repository
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/watch?v=LMWu3Ui2IAk
      name: Setup video
  # Social-preview banner, consumed by overrides/main.html for the Open Graph /
  # Twitter / Discord embed. This MUST be an absolute URL — link scrapers do not
  # resolve relative paths. A page can override it with `image:` in front matter.
  image: https://getemailverified.com/assets/og-image.png
  image_alt: >-
    EmailVerify — email verification for Discord servers. Verify members by
    domain in 30 seconds. 6-digit code, @*.edu wildcards, open source.
  # Actual pixels of docs/assets/og-image.png — a @2x export of the 1200x630
  # Open Graph size. Discord and Slack use these to reserve the embed's shape
  # before the image arrives; without them a wide banner can flash as a square.
  image_width: "2400"
  image_height: "1260"
  invite_url: https://discord.com/api/oauth2/authorize?client_id=895056197789564969&permissions=268504128&scope=bot%20applications.commands
nav:
  - Home: 'index.md'
  - Get started:
      - 'Quick start': 'setup.md'
      - 'All commands': 'commands.md'
      - 'Compare alternatives': 'compare.md'
  - Use cases:
      - 'Universities & schools': 'use-cases/university.md'
      - 'Companies & teams': 'use-cases/company.md'
      - 'Courses, events & hackathons': 'use-cases/communities.md'
  - Premium: 'premium.md'
  - Project:
      - Statistics: 'statistics.md'
      - Status: 'status.md'
      - Contributors: 'contributing.md'
  - Legal:
      - Impressum: 'legal/impressum.md'
      - Datenschutz: 'legal/datenschutz.md'
      - AGB: 'legal/agb.md'
      - Widerruf: 'legal/widerruf.md'
      - Terms: 'legal/terms.md'
      - AV-Vertrag (DPA): 'legal/avv.md'
  - Buy Me a Coffee❤️: https://buymeacoffee.com/sral12486
